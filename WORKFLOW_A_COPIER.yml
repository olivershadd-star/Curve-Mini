name: Curve Mini Prototype 0.1 Windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Preparer Windows 64 bits
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Tester les commandes et les courbes
        run: |
          cmake --build build --config Release --target midi_tests --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
      - name: Compiler le VST3 et l autonome
        run: cmake --build build --config Release --target CurvePilotMidi01_VST3 CurvePilotMidi01_Standalone --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: Curve-Mini-Prototype-0.1-Windows-x64
          path: |
            build/CurvePilotMidi01_artefacts/Release/VST3/
            build/CurvePilotMidi01_artefacts/Release/Standalone/
          if-no-files-found: error
