name: Curve Mini Prototype 0.2.1 Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Source/**'
      - 'tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Preparer Windows 64 bits
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Tester le modele MIDI et les exports
        run: |
          cmake --build build --config Release --target midi_tests --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release -R midi_model --output-on-failure
      - name: Compiler le VST3, l autonome et les tests du plugin
        run: cmake --build build --config Release --target CurvePilotMidi01_VST3 CurvePilotMidi01_Standalone plugin_tests vst3_load_tests --parallel 2
      - name: Verifier le module Windows livre et ses dependances
        shell: pwsh
        run: ./tools/check-vst3.ps1 -Bundle 'build/CurvePilotMidi01_artefacts/Release/VST3/Curve Mini Prototype 0.2.vst3'
      - name: Tester les sauvegardes, les potards et le chargement VST3
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Telecharger le precedent paquet pour diagnostic comparatif
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Curve-Mini-Prototype-0.2-Windows-x64
          run-id: 42853157169
          github-token: ${{ github.token }}
          path: previous-package
      - name: Inspecter le precedent VST3 (diagnostic uniquement)
        continue-on-error: true
        shell: pwsh
        run: |
          $bundle = Get-ChildItem previous-package -Recurse -Directory -Filter '*.vst3' | Select-Object -First 1
          if (!$bundle) { throw 'Previous VST3 bundle absent' }
          ./tools/check-vst3.ps1 -Bundle $bundle.FullName -AllowSharedRuntime
          & 'build/vst3_load_tests_artefacts/Release/Curve Mini VST3 Load Test.exe' $bundle.FullName --legacy-diagnostic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Curve-Mini-Prototype-0.2.1-Windows-x64
          path: |
            build/CurvePilotMidi01_artefacts/Release/VST3/
            build/CurvePilotMidi01_artefacts/Release/Standalone/
          if-no-files-found: error
