name: Curve Mini - quatre courbes Lite - Windows
on:
  workflow_dispatch:
  push:
    branches: [quatre-courbes-lite]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configurer Windows x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Compiler les tests
        run: cmake --build build --config Release --target curve_tests motion_tests processor_tests vst3_test --parallel 2
      - name: Verifier les courbes, mouvements et processeur
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Conserver l apercu de l interface native
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'build/curve-mini-interface.png') {
            $nativeImage = [Convert]::ToBase64String([IO.File]::ReadAllBytes('build/curve-mini-interface.png'))
            for ($offset = 0; $offset -lt $nativeImage.Length; $offset += 4096) {
              Write-Output ('NATIVE_IMAGE_CHUNK ' + $nativeImage.Substring($offset, [Math]::Min(4096, $nativeImage.Length - $offset)))
            }
          }
      - name: Compiler les formats Windows
        run: cmake --build build --config Release --target CurveMini_VST3 CurveMini_Standalone --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: Curve-Mini-4-Courbes-Lite-Windows-x64
          path: |
            build/CurveMini_artefacts/Release/VST3/
            build/CurveMini_artefacts/Release/Standalone/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Curve-Mini-4-Courbes-Interface
          path: |
            build/curve-mini-interface.png
            build/Testing/Temporary/LastTest.log
          if-no-files-found: error
