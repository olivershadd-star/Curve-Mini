name: Curve Mini Precision MIDI Windows
on:
  push:
    branches: [precision-midi-v05]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target curve_tests motion_tests processor_tests vst3_test window_placement_tests CurveMini_Standalone --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: Curve-Mini-Precision-MIDI-Windows-x64
          path: |
            build/CurveMini_artefacts/Release/VST3/
            build/CurveMini_artefacts/Release/Standalone/
            build/curve-mini-interface.png
